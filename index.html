<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corporate Dashboard System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0F766E', // Teal 700
                        secondary: '#14B8A6', // Teal 500
                        accent: '#F59E0B', // Amber 500
                        background: '#F8FAFC' // Slate 50
                    }
                }
            }
        }
    </script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Hide sections initially */
        .hidden-view { display: none !important; }
    </style>
</head>
<body class="bg-background text-gray-800 font-sans h-screen overflow-hidden flex">

    <!-- LOGIN VIEW -->
    <div id="loginView" class="fixed inset-0 z-50 flex items-center justify-center bg-background hidden-view">
        <div class="glass-card p-8 rounded-2xl w-full max-w-md mx-4">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-primary text-white rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-900">Login</h1>
                <p class="text-gray-500 mt-2">Document Management System</p>
            </div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Select Account</label>
                    <select id="username" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none bg-white">
                        <option value="" disabled selected>Please select an account...</option>
                        <option value="Staff">Staff</option>
                        <option value="Rosli">Rosli</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none">
                </div>
                <button type="submit" class="w-full bg-primary hover:bg-teal-800 text-white font-medium py-2.5 rounded-lg transition-colors">
                    Login
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN DASHBOARD VIEW -->
    <div id="mainView" class="w-full h-full flex hidden-view">
        
        <!-- SIDEBAR -->
        <aside class="w-64 bg-white border-r border-gray-200 flex flex-col z-20 shadow-sm relative">
            <div class="h-16 flex items-center px-6 border-b border-gray-200">
                <i class="fas fa-layer-group text-primary text-xl mr-3"></i>
                <span class="text-lg font-bold text-gray-800">Main System</span>
            </div>
            <div class="p-4 border-b border-gray-100 flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-primary font-bold" id="userInitial">U</div>
                <div>
                    <p class="text-sm font-bold text-gray-800" id="displayUsername">User</p>
                    <p class="text-xs text-gray-500" id="displayRole">Role</p>
                </div>
            </div>
            <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
                <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-gray-600 hover:bg-gray-50 transition-colors font-medium">
                    <i class="fas fa-chart-pie w-5"></i> Dashboard
                </button>
                <button onclick="switchTab('rekod')" id="nav-rekod" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-gray-600 hover:bg-gray-50 transition-colors font-medium">
                    <i class="fas fa-folder-open w-5"></i> All Records
                </button>
                <button onclick="switchTab('approval')" id="nav-approval" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-gray-600 hover:bg-gray-50 transition-colors font-medium">
                    <i class="fas fa-clipboard-check w-5"></i> Approvals
                </button>
                <button onclick="switchTab('staff')" id="nav-staff" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-gray-600 hover:bg-gray-50 transition-colors font-medium">
                    <i class="fas fa-users w-5"></i> Staff Data
                </button>
            </nav>
            <div class="p-4 border-t border-gray-200">
                <button onclick="handleLogout()" class="w-full flex items-center justify-center gap-2 px-4 py-2 text-red-600 hover:bg-red-50 rounded-lg transition-colors font-medium text-sm">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </aside>

        <!-- CONTENT AREA -->
        <main class="flex-1 flex flex-col min-w-0 bg-background relative">
            
            <!-- LOADING OVERLAY -->
            <div id="loadingOverlay" class="absolute inset-0 bg-white/70 backdrop-blur-sm z-30 flex items-center justify-center hidden-view">
                <div class="text-center">
                    <i class="fas fa-circle-notch fa-spin text-4xl text-primary mb-3"></i>
                    <p class="text-gray-600 font-medium">Loading data...</p>
                </div>
            </div>

            <!-- TOPBAR -->
            <header class="h-16 bg-white border-b border-gray-200 flex items-center px-8 z-10 shadow-sm">
                <h2 class="text-xl font-semibold text-gray-800" id="topbarTitle">Dashboard</h2>
            </header>

            <!-- SCROLLABLE CONTENT -->
            <div class="flex-1 overflow-y-auto p-6 md:p-8">
                
                <!-- TAB: DASHBOARD -->
                <div id="tab-dashboard" class="tab-content hidden-view">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                        <div class="glass-card p-6 rounded-2xl border-l-4 border-primary">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-sm font-medium text-gray-500 mb-1">Total Records</p>
                                    <h3 class="text-3xl font-bold text-gray-900" id="stat-total">0</h3>
                                </div>
                                <div class="w-10 h-10 rounded-full bg-teal-50 flex items-center justify-center text-primary">
                                    <i class="fas fa-file-alt"></i>
                                </div>
                            </div>
                        </div>
                        <div class="glass-card p-6 rounded-2xl border-l-4 border-accent">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-sm font-medium text-gray-500 mb-1">Pending Approval</p>
                                    <h3 class="text-3xl font-bold text-gray-900" id="stat-pending">0</h3>
                                </div>
                                <div class="w-10 h-10 rounded-full bg-amber-50 flex items-center justify-center text-accent">
                                    <i class="fas fa-clock"></i>
                                </div>
                            </div>
                        </div>
                        <div class="glass-card p-6 rounded-2xl border-l-4 border-secondary">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-sm font-medium text-gray-500 mb-1">Completed / Approved</p>
                                    <h3 class="text-3xl font-bold text-gray-900" id="stat-completed">0</h3>
                                </div>
                                <div class="w-10 h-10 rounded-full bg-teal-50 flex items-center justify-center text-secondary">
                                    <i class="fas fa-check-circle"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- TAB: TABLE VIEWS (REKOD, APPROVAL, STAFF) -->
                <div id="tab-table" class="tab-content hidden-view h-full flex flex-col">
                    <div class="glass-card rounded-2xl flex flex-col h-[calc(100vh-180px)]">
                        
                        <!-- Toolbar -->
                        <div class="p-4 border-b border-gray-200 flex flex-col sm:flex-row items-center justify-between gap-4 bg-white rounded-t-2xl">
                            <div class="relative w-full sm:w-80">
                                <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                                <input type="text" id="searchInput" placeholder="Search records..." onkeyup="handleSearch()" class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary outline-none text-sm">
                            </div>
                            <div class="text-sm text-gray-500 font-medium" id="tableRecordCount">
                                0 records
                            </div>
                        </div>

                        <!-- Table Container -->
                        <div class="flex-1 overflow-auto bg-white relative">
                            <table class="w-full text-left border-collapse whitespace-nowrap min-w-max">
                                <thead class="bg-gray-50 sticky top-0 z-10 shadow-sm border-b border-gray-200" id="tableHead">
                                    <!-- Diisi oleh JS -->
                                </thead>
                                <tbody class="divide-y divide-gray-100" id="tableBody">
                                    <!-- Diisi oleh JS -->
                                </tbody>
                            </table>
                        </div>

                        <!-- Pagination -->
                        <div class="p-4 border-t border-gray-200 bg-white rounded-b-2xl flex items-center justify-between">
                            <p class="text-sm text-gray-500" id="paginationInfo">Showing 0 - 0 of 0</p>
                            <div class="flex gap-2">
                                <button onclick="changePage(-1)" class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50 text-gray-600 disabled:opacity-50"><i class="fas fa-chevron-left"></i></button>
                                <button onclick="changePage(1)" class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50 text-gray-600 disabled:opacity-50"><i class="fas fa-chevron-right"></i></button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // ==========================================
        // KONFIGURASI PENTING
        // ==========================================
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbyW_nDaR1k0MtduxhRl1Q2E7kdja4fc79VxzLqgY6yGwB109CCVA7NYs0K51aLH-B8/exec';
        
        // ==========================================
        // STATE PENGURUSAN
        // ==========================================
        const state = {
            user: null,
            activeTab: 'dashboard',
            records: [],
            staff: [],
            
            // Table controls
            filteredData: [],
            currentDataMode: 'rekod', // rekod | approval | staff
            searchQuery: '',
            sortKey: null,
            sortAsc: true,
            
            // Pagination
            currentPage: 1,
            itemsPerPage: 15
        };

        // ==========================================
        // INIT & AUTHENTICATION
        // ==========================================
        window.onload = () => {
            const savedSession = localStorage.getItem('sistem_session');
            if (savedSession) {
                state.user = JSON.parse(savedSession);
                showMainView();
                loadDataFromBackend();
            } else {
                document.getElementById('loginView').classList.remove('hidden-view');
            }
        };

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            let role = '';
            
            // Pengesahan Kata Laluan & Tetapan Peranan Automatik
            let isPasswordValid = false;
            if (username === 'Staff' && password === 'staff123') {
                isPasswordValid = true;
                role = 'Staff';
            }
            else if (username === 'Rosli' && password === 'Rosli123') {
                isPasswordValid = true;
                role = 'Pelulus';
            }
            else if (username === 'Admin' && password === 'Admin2026') {
                isPasswordValid = true;
                role = 'Admin';
            }

            if (!isPasswordValid) {
                alert('Invalid Account or Password. Please try again.');
                return;
            }
            
            state.user = { username, role };
            localStorage.setItem('sistem_session', JSON.stringify(state.user));
            
            document.getElementById('loginView').classList.add('hidden-view');
            showMainView();
            loadDataFromBackend();
        }

        function handleLogout() {
            localStorage.removeItem('sistem_session');
            state.user = null;
            state.records = [];
            state.staff = [];
            
            document.getElementById('mainView').classList.add('hidden-view');
            document.getElementById('loginView').classList.remove('hidden-view');
            document.getElementById('loginForm').reset();
        }

        function showMainView() {
            document.getElementById('mainView').classList.remove('hidden-view');
            document.getElementById('displayUsername').innerText = state.user.username;
            document.getElementById('displayRole').innerText = state.user.role;
            document.getElementById('userInitial').innerText = state.user.username.charAt(0).toUpperCase();
            switchTab('dashboard');
        }

        function setLoading(isLoading) {
            const overlay = document.getElementById('loadingOverlay');
            if(isLoading) overlay.classList.remove('hidden-view');
            else overlay.classList.add('hidden-view');
        }

        // ==========================================
        // BACKEND API CALLS
        // ==========================================
        async function apiCall(action, extraPayload = {}) {
            if(GAS_URL.includes('PLEASE_ENTER')) {
                alert('Please update the GAS_URL variable in the JavaScript code before proceeding.');
                return { status: 'error' };
            }
            
            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: action, ...extraPayload })
                });
                return await response.json();
            } catch (error) {
                console.error("API Error:", error);
                alert("Database connection error.");
                return { status: 'error' };
            }
        }

        async function loadDataFromBackend() {
            setLoading(true);
            
            // Fetch initial records
            const resRecords = await apiCall('getInitialData');
            if(resRecords.status === 'success') {
                state.records = resRecords.data || [];
            }

            // Fetch staff data
            const resStaff = await apiCall('getStaffData');
            if(resStaff.status === 'success') {
                state.staff = resStaff.data || [];
            }

            updateDashboardStats();
            if(state.activeTab !== 'dashboard') {
                processTableData();
            }
            
            setLoading(false);
        }

        async function handleAction(controlNo, newStatus) {
            if(!confirm(`Are you sure you want to change the status to "${newStatus}"?`)) return;
            
            setLoading(true);
            const response = await apiCall('approveRecord', {
                controlNo: controlNo,
                user: state.user.username,
                status: newStatus
            });
            
            if(response.status === 'success') {
                // Reload data to reflect changes
                await loadDataFromBackend();
            } else {
                alert("Error: " + response.message);
                setLoading(false);
            }
        }

        // ==========================================
        // UI & NAVIGATION
        // ==========================================
        const tabTitles = {
            'dashboard': 'Dashboard',
            'rekod': 'All Document Records',
            'approval': 'Pending Approval',
            'staff': 'Staff Data'
        };

        function switchTab(tabId) {
            state.activeTab = tabId;
            
            // Reset active state di sidebar
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-teal-50', 'text-primary', 'border-r-4', 'border-primary');
            });
            const activeBtn = document.getElementById(`nav-${tabId}`);
            if(activeBtn) {
                activeBtn.classList.add('bg-teal-50', 'text-primary', 'border-r-4', 'border-primary');
            }

            document.getElementById('topbarTitle').innerText = tabTitles[tabId];

            // Show/Hide content
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden-view'));
            
            if (tabId === 'dashboard') {
                document.getElementById('tab-dashboard').classList.remove('hidden-view');
                updateDashboardStats();
            } else {
                document.getElementById('tab-table').classList.remove('hidden-view');
                state.currentDataMode = tabId;
                
                // Reset search & pagination
                document.getElementById('searchInput').value = '';
                state.searchQuery = '';
                state.currentPage = 1;
                state.sortKey = null;
                
                processTableData();
            }
        }

        function updateDashboardStats() {
            const total = state.records.length;
            const pending = state.records.filter(r => r.STATUS === 'Pending For Approval').length;
            const completed = state.records.filter(r => r.STATUS === 'Completed').length;

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-pending').innerText = pending;
            document.getElementById('stat-completed').innerText = completed;
        }

        // ==========================================
        // TABLE LOGIC (SORT, SEARCH, PAGINATION)
        // ==========================================
        function handleSearch() {
            state.searchQuery = document.getElementById('searchInput').value.toLowerCase();
            state.currentPage = 1;
            processTableData();
        }

        function handleSort(key) {
            if (state.sortKey === key) {
                state.sortAsc = !state.sortAsc;
            } else {
                state.sortKey = key;
                state.sortAsc = true;
            }
            processTableData();
        }

        function changePage(dir) {
            const maxPage = Math.ceil(state.filteredData.length / state.itemsPerPage);
            state.currentPage += dir;
            if (state.currentPage < 1) state.currentPage = 1;
            if (state.currentPage > maxPage) state.currentPage = maxPage;
            renderTable();
        }

        function processTableData() {
            // 1. Pilih sumber data
            let data = [];
            if (state.currentDataMode === 'rekod') {
                data = [...state.records];
            } else if (state.currentDataMode === 'approval') {
                data = state.records.filter(r => r.STATUS === 'Pending For Approval');
            } else if (state.currentDataMode === 'staff') {
                data = [...state.staff];
            }

            // 2. Search
            if (state.searchQuery) {
                data = data.filter(row => 
                    Object.values(row).some(val => 
                        String(val).toLowerCase().includes(state.searchQuery)
                    )
                );
            }

            // 3. Sort
            if (state.sortKey) {
                data.sort((a, b) => {
                    const valA = String(a[state.sortKey] || '').toLowerCase();
                    const valB = String(b[state.sortKey] || '').toLowerCase();
                    if (valA < valB) return state.sortAsc ? -1 : 1;
                    if (valA > valB) return state.sortAsc ? 1 : -1;
                    return 0;
                });
            }

            state.filteredData = data;
            renderTable();
        }

        function renderTable() {
            const thead = document.getElementById('tableHead');
            const tbody = document.getElementById('tableBody');
            
            if (state.filteredData.length === 0) {
                thead.innerHTML = '';
                tbody.innerHTML = `<tr><td class="p-8 text-center text-gray-500">No records found.</td></tr>`;
                document.getElementById('tableRecordCount').innerText = `0 records`;
                document.getElementById('paginationInfo').innerText = `Showing 0 - 0 of 0`;
                return;
            }

            // Tentukan Header
            let headers = [];
            if (state.currentDataMode === 'staff') {
                headers = ["NAME", "POSITION", "GRED", "EMAIL", "OFFICE NUMBER"];
            } else {
                headers = ["NO", "CONTROL NO", "STAFF NAME", "DATE", "TITLE", "STATUS", "APPROVED BY"];
                if (state.currentDataMode === 'rekod') {
                    // Tambah column Action untuk rekod
                    headers.push("ACTION");
                } else if (state.currentDataMode === 'approval') {
                    headers.push("ACTION");
                }
            }

            // Render Head
            let headHTML = '<tr>';
            headers.forEach(h => {
                if (h === 'ACTION') {
                    headHTML += `<th class="p-4 text-xs font-semibold text-gray-500 uppercase tracking-wider text-right">Action</th>`;
                } else {
                    const icon = state.sortKey === h ? (state.sortAsc ? 'fa-sort-up text-primary' : 'fa-sort-down text-primary') : 'fa-sort text-gray-300';
                    headHTML += `
                        <th onclick="handleSort('${h}')" class="p-4 text-xs font-semibold text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100 select-none">
                            <div class="flex items-center gap-2">${h} <i class="fas ${icon}"></i></div>
                        </th>
                    `;
                }
            });
            headHTML += '</tr>';
            thead.innerHTML = headHTML;

            // Render Body (Pagination)
            const startIndex = (state.currentPage - 1) * state.itemsPerPage;
            const endIndex = startIndex + state.itemsPerPage;
            const paginatedData = state.filteredData.slice(startIndex, endIndex);

            let bodyHTML = '';
            paginatedData.forEach(row => {
                bodyHTML += '<tr class="hover:bg-gray-50 transition-colors text-sm text-gray-700">';
                
                headers.forEach(h => {
                    if (h === 'ACTION') {
                        let btn = '<div class="flex items-center justify-end gap-2">';
                        const statusVal = row['STATUS'];
                        const cNo = row['CONTROL NO'];
                        
                        if (state.currentDataMode === 'rekod') {
                            if (statusVal !== 'Completed') {
                                if (state.user.role === 'Staff' || state.user.role === 'Admin') {
                                    btn += `<button onclick="handleEdit('${cNo}')" class="text-primary hover:bg-teal-50 px-3 py-1 rounded border border-primary text-xs font-medium transition-colors">Edit</button>`;
                                    btn += `<button onclick="handleComplete('${cNo}')" class="bg-primary hover:bg-teal-800 text-white px-3 py-1 rounded text-xs font-medium transition-colors">Complete</button>`;
                                }
                            } else {
                                if (state.user.role === 'Admin') {
                                    btn += `<button onclick="handleReopen('${cNo}')" class="border border-red-500 text-red-600 hover:bg-red-50 px-3 py-1 rounded text-xs font-medium transition-colors">Reopen</button>`;
                                }
                            }
                        } else if (state.currentDataMode === 'approval') {
                            if (statusVal === 'Pending For Approval' && (state.user.role === 'Pelulus' || state.user.role === 'Admin')) {
                                btn += `<button onclick="handleApprove('${cNo}')" class="bg-primary hover:bg-teal-800 text-white px-3 py-1 rounded text-xs font-medium transition-colors">Approve</button>`;
                            }
                        }
                        btn += '</div>';
                        bodyHTML += `<td class="p-4">${btn}</td>`;
                    } else if (h === 'STATUS') {
                        const statusVal = row[h];
                        let badgeClass = "bg-gray-100 text-gray-800";
                        if(statusVal === 'Completed') badgeClass = "bg-green-100 text-green-800";
                        else if(statusVal === 'Pending For Approval') badgeClass = "bg-blue-100 text-blue-800";
                        else if(statusVal === 'Pending Edit') badgeClass = "bg-red-100 text-red-800";
                        else if(statusVal === 'Pending' || statusVal === '') badgeClass = "bg-orange-100 text-orange-800";
                        
                        bodyHTML += `<td class="p-4"><span class="px-2.5 py-1 rounded-full text-xs font-medium ${badgeClass}">${statusVal || 'Pending'}</span></td>`;
                    } else {
                        bodyHTML += `<td class="p-4">${row[h] || '-'}</td>`;
                    }
                });
                bodyHTML += '</tr>';
            });
            tbody.innerHTML = bodyHTML;

            // Update infos
            document.getElementById('tableRecordCount').innerText = `${state.filteredData.length} records`;
            const endDisplay = Math.min(endIndex, state.filteredData.length);
            document.getElementById('paginationInfo').innerText = `Showing ${startIndex + 1} - ${endDisplay} of ${state.filteredData.length}`;
        }
    </script>
</body>
</html>
